<body>
  <div class="wrap">
    <h1>Chinese Chess</h1>
    <p class="subtitle">Xiangqi (象棋) — pass-and-play locally, against the computer, or online with a friend on another computer. Red moves first. Capture the enemy general, or trap them with no legal moves, to win.</p>
    <div id="app"></div>
  </div>
<script>
"use strict";

// ---------------------------------------------------------------------------
// Engine (ported from the portfolio's xiangqi-engine.ts)
// ---------------------------------------------------------------------------

const ROWS = 10;
const COLS = 9;

const BACK_RANK = ["chariot", "horse", "elephant", "advisor", "general", "advisor", "elephant", "horse", "chariot"];

function createInitialBoard() {
  const board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  BACK_RANK.forEach((type, col) => {
    board[0][col] = { type, color: "black" };
    board[9][col] = { type, color: "red" };
  });
  [1, 7].forEach((col) => {
    board[2][col] = { type: "cannon", color: "black" };
    board[7][col] = { type: "cannon", color: "red" };
  });
  [0, 2, 4, 6, 8].forEach((col) => {
    board[3][col] = { type: "soldier", color: "black" };
    board[6][col] = { type: "soldier", color: "red" };
  });
  return board;
}

function cloneBoard(board) {
  return board.map((row) => row.slice());
}

function inBounds(row, col) {
  return row >= 0 && row < ROWS && col >= 0 && col < COLS;
}

function inPalace(row, col, color) {
  const rows = color === "black" ? [0, 1, 2] : [7, 8, 9];
  return rows.includes(row) && col >= 3 && col <= 5;
}

function isOwnHalf(row, color) {
  return color === "black" ? row <= 4 : row >= 5;
}

function samePos(a, b) {
  return a.row === b.row && a.col === b.col;
}

function pushIfValid(board, color, row, col, moves) {
  if (!inBounds(row, col)) return;
  const target = board[row][col];
  if (!target || target.color !== color) moves.push({ row, col });
}

function generalMoves(board, pos, color) {
  const moves = [];
  for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const row = pos.row + dr, col = pos.col + dc;
    if (!inPalace(row, col, color)) continue;
    pushIfValid(board, color, row, col, moves);
  }
  return moves;
}

function advisorMoves(board, pos, color) {
  const moves = [];
  for (const [dr, dc] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
    const row = pos.row + dr, col = pos.col + dc;
    if (!inPalace(row, col, color)) continue;
    pushIfValid(board, color, row, col, moves);
  }
  return moves;
}

function elephantMoves(board, pos, color) {
  const moves = [];
  for (const [dr, dc] of [[2, 2], [2, -2], [-2, 2], [-2, -2]]) {
    const row = pos.row + dr, col = pos.col + dc;
    if (!inBounds(row, col) || !isOwnHalf(row, color)) continue;
    const eyeRow = pos.row + dr / 2, eyeCol = pos.col + dc / 2;
    if (board[eyeRow][eyeCol]) continue;
    pushIfValid(board, color, row, col, moves);
  }
  return moves;
}

const HORSE_OFFSETS = [
  { dr: -2, dc: -1, leg: { dr: -1, dc: 0 } },
  { dr: -2, dc: 1, leg: { dr: -1, dc: 0 } },
  { dr: 2, dc: -1, leg: { dr: 1, dc: 0 } },
  { dr: 2, dc: 1, leg: { dr: 1, dc: 0 } },
  { dr: -1, dc: -2, leg: { dr: 0, dc: -1 } },
  { dr: 1, dc: -2, leg: { dr: 0, dc: -1 } },
  { dr: -1, dc: 2, leg: { dr: 0, dc: 1 } },
  { dr: 1, dc: 2, leg: { dr: 0, dc: 1 } },
];

function horseMoves(board, pos, color) {
  const moves = [];
  for (const { dr, dc, leg } of HORSE_OFFSETS) {
    const row = pos.row + dr, col = pos.col + dc;
    if (!inBounds(row, col)) continue;
    const legRow = pos.row + leg.dr, legCol = pos.col + leg.dc;
    if (board[legRow][legCol]) continue;
    pushIfValid(board, color, row, col, moves);
  }
  return moves;
}

const ORTHOGONAL_DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

function chariotMoves(board, pos, color) {
  const moves = [];
  for (const [dr, dc] of ORTHOGONAL_DIRS) {
    let row = pos.row + dr, col = pos.col + dc;
    while (inBounds(row, col)) {
      const target = board[row][col];
      if (!target) {
        moves.push({ row, col });
      } else {
        if (target.color !== color) moves.push({ row, col });
        break;
      }
      row += dr; col += dc;
    }
  }
  return moves;
}

function cannonMoves(board, pos, color) {
  const moves = [];
  for (const [dr, dc] of ORTHOGONAL_DIRS) {
    let row = pos.row + dr, col = pos.col + dc;
    let screenFound = false;
    while (inBounds(row, col)) {
      const target = board[row][col];
      if (!screenFound) {
        if (!target) moves.push({ row, col });
        else screenFound = true;
      } else if (target) {
        if (target.color !== color) moves.push({ row, col });
        break;
      }
      row += dr; col += dc;
    }
  }
  return moves;
}

function soldierMoves(board, pos, color) {
  const moves = [];
  const forwardDr = color === "black" ? 1 : -1;
  const crossedRiver = color === "black" ? pos.row >= 5 : pos.row <= 4;
  const candidates = [[forwardDr, 0]];
  if (crossedRiver) candidates.push([0, -1], [0, 1]);
  for (const [dr, dc] of candidates) {
    pushIfValid(board, color, pos.row + dr, pos.col + dc, moves);
  }
  return moves;
}

function getPseudoMoves(board, pos) {
  const piece = board[pos.row][pos.col];
  if (!piece) return [];
  switch (piece.type) {
    case "general": return generalMoves(board, pos, piece.color);
    case "advisor": return advisorMoves(board, pos, piece.color);
    case "elephant": return elephantMoves(board, pos, piece.color);
    case "horse": return horseMoves(board, pos, piece.color);
    case "chariot": return chariotMoves(board, pos, piece.color);
    case "cannon": return cannonMoves(board, pos, piece.color);
    case "soldier": return soldierMoves(board, pos, piece.color);
    default: return [];
  }
}

function findGeneral(board, color) {
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const piece = board[row][col];
      if (piece && piece.type === "general" && piece.color === color) return { row, col };
    }
  }
  return null;
}

function isSquareAttacked(board, target, byColor) {
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const piece = board[row][col];
      if (!piece || piece.color !== byColor) continue;
      const moves = getPseudoMoves(board, { row, col });
      if (moves.some((m) => samePos(m, target))) return true;
    }
  }
  return false;
}

function isInCheck(board, color) {
  const generalPos = findGeneral(board, color);
  if (!generalPos) return false;
  const enemyColor = color === "red" ? "black" : "red";
  if (isSquareAttacked(board, generalPos, enemyColor)) return true;

  const enemyGeneralPos = findGeneral(board, enemyColor);
  if (enemyGeneralPos && enemyGeneralPos.col === generalPos.col) {
    const minRow = Math.min(generalPos.row, enemyGeneralPos.row);
    const maxRow = Math.max(generalPos.row, enemyGeneralPos.row);
    let clear = true;
    for (let row = minRow + 1; row < maxRow; row++) {
      if (board[row][generalPos.col]) { clear = false; break; }
    }
    if (clear) return true;
  }
  return false;
}

function getLegalMoves(board, pos) {
  const piece = board[pos.row][pos.col];
  if (!piece) return [];
  const pseudo = getPseudoMoves(board, pos);
  return pseudo.filter((dest) => {
    const next = cloneBoard(board);
    next[dest.row][dest.col] = piece;
    next[pos.row][pos.col] = null;
    return !isInCheck(next, piece.color);
  });
}

function hasAnyLegalMove(board, color) {
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const piece = board[row][col];
      if (piece && piece.color === color && getLegalMoves(board, { row, col }).length > 0) return true;
    }
  }
  return false;
}

function otherColor(color) {
  return color === "red" ? "black" : "red";
}

const PIECE_VALUES = { general: 1000, chariot: 9, cannon: 4.5, horse: 4, elephant: 2, advisor: 2, soldier: 1 };
const PIECE_NAMES = { general: "General", chariot: "Chariot", cannon: "Cannon", horse: "Horse", elephant: "Elephant", advisor: "Advisor", soldier: "Soldier" };

// ---------------------------------------------------------------------------
// Move evaluation — a shallow ("think one move ahead") search: for each
// candidate move, also look at the opponent's strongest immediate reply, so
// a move that looks good right now but simply hangs a piece gets caught and
// explained, not just recommended for its surface-level capture/check value.
// This is still a heuristic, not a full engine, but it reasons the way a
// club player actually does when picking between a few candidate moves.
// ---------------------------------------------------------------------------

function materialBalance(board) {
  let score = 0;
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const piece = board[row][col];
      if (piece) score += (piece.color === "red" ? 1 : -1) * PIECE_VALUES[piece.type];
    }
  }
  return score;
}

function materialFor(board, color) {
  const balance = materialBalance(board);
  return color === "red" ? balance : -balance;
}

function applyMoveToBoard(board, from, to) {
  const piece = board[from.row][from.col];
  const next = cloneBoard(board);
  next[to.row][to.col] = piece;
  next[from.row][from.col] = null;
  return next;
}

// Opponent's single strongest-looking immediate reply (by capture value,
// then check), used only to test how well a candidate move for the other
// side holds up — not a recursive search, so this stays fast.
function bestImmediateReply(board, color) {
  let best = null;
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const piece = board[row][col];
      if (!piece || piece.color !== color) continue;
      const from = { row, col };
      for (const to of getLegalMoves(board, from)) {
        const captured = board[to.row][to.col];
        const gain = captured ? PIECE_VALUES[captured.type] : 0;
        if (!best || gain > best.gain) best = { from, to, gain, captured };
      }
    }
  }
  if (!best) return null;
  return { move: best, resultingBoard: applyMoveToBoard(board, best.from, best.to) };
}

// ---------------------------------------------------------------------------
// Repetition rules — perpetual check (长将) and perpetual chase (长捉).
//
// Official Xiangqi rules forbid a player from repeating a position by
// checking (or "chasing" — repeatedly threatening to win material from an
// undefended piece) on every move of the cycle: the side doing it must vary
// their move, or forfeits. If BOTH sides are forcing each other through the
// whole cycle (mutual perpetual check/chase), it's a draw instead. Plain
// repetition with no check or chase involved by either side is also a draw.
//
// "Check" is unambiguous. "Chase" is genuinely fuzzy even for human
// tournament arbiters (official rule sets carve out several exemptions —
// e.g. mutual attacks, certain piece pairings). The heuristic below judges a
// move a "chase" if the piece just moved threatens a capture next turn that
// would still net material after the opponent's best reply — a reasonable
// approximation, not a tournament-certified adjudicator.
// ---------------------------------------------------------------------------

const PIECE_CODE = { general: "g", advisor: "a", elephant: "e", horse: "h", chariot: "r", cannon: "c", soldier: "s" };

function positionKey(board, turn) {
  let key = turn[0];
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const piece = board[row][col];
      key += piece ? (piece.color === "red" ? PIECE_CODE[piece.type].toUpperCase() : PIECE_CODE[piece.type]) : ".";
    }
  }
  return key;
}

// Does the piece now at `at` threaten a capture next turn that still nets
// material for `color` even after the opponent's single best defensive reply?
function threatensProfitableCapture(boardAfter, color, at) {
  const materialBefore = materialFor(boardAfter, color);
  for (const dest of getLegalMoves(boardAfter, at)) {
    const target = boardAfter[dest.row][dest.col];
    if (!target || target.color === color) continue;
    const afterCapture = applyMoveToBoard(boardAfter, at, dest);
    const reply = bestImmediateReply(afterCapture, otherColor(color));
    const materialAfter = reply ? materialFor(reply.resultingBoard, color) : materialFor(afterCapture, color);
    if (materialAfter > materialBefore + 0.5) return true;
  }
  return false;
}

function moveIsChase(boardBefore, from, to) {
  if (boardBefore[to.row][to.col]) return false; // a capture resolves the tension, it isn't "chasing"
  const piece = boardBefore[from.row][from.col];
  const after = applyMoveToBoard(boardBefore, from, to);
  return threatensProfitableCapture(after, piece.color, to);
}

// Looks at the most recent repeated position and decides whether either side
// was perpetually forcing (all-check and/or all-chase) through the cycle.
// Returns null if there's no repetition verdict yet.
function evaluateRepetition() {
  const keys = state.positionKeys;
  const lastKey = keys[keys.length - 1];
  const occurrences = [];
  for (let i = 0; i < keys.length; i++) if (keys[i] === lastKey) occurrences.push(i);
  if (occurrences.length < 3) return null;

  const endIdx = occurrences[occurrences.length - 1];
  const startIdx = occurrences[occurrences.length - 2];
  const cycleRecords = state.moveRecords.slice(startIdx, endIdx);
  if (cycleRecords.length === 0) return null;

  const byColor = { red: [], black: [] };
  cycleRecords.forEach((r) => byColor[r.color].push(r));

  const allForcing = (records) => records.length > 0 && records.every((r) => r.isCheck || r.isChase);
  const describeForcing = (records) => (records.every((r) => r.isCheck) ? "perpetual check" : "perpetual chase");

  const redForcing = allForcing(byColor.red);
  const blackForcing = allForcing(byColor.black);

  if (redForcing && blackForcing) return { type: "draw", reason: "mutual perpetual check" };
  if (redForcing) return { type: "loss", loser: "red", reason: describeForcing(byColor.red) };
  if (blackForcing) return { type: "loss", loser: "black", reason: describeForcing(byColor.black) };
  return { type: "draw", reason: "repetition" };
}

// ---------------------------------------------------------------------------
// Search engine — negamax with alpha-beta pruning, iterative deepening under
// a wall-clock time budget, and a capture-only quiescence extension at the
// horizon so the search doesn't misjudge a trade right at its depth limit.
// A time budget (rather than a fixed depth) adapts to however expensive move
// generation turns out to be in a given position, and lets the UI stay
// responsive by yielding between depths. Shared by the computer's own moves
// and by the hint/insight panel, so both "see" the position the same way.
// ---------------------------------------------------------------------------

const MATE_SCORE = 100000;
const QUIESCENCE_MAX_PLIES = 4;
const TIME_CHECK_INTERVAL = 512; // only poll the clock every N nodes, it's not free
const MAX_SEARCH_DEPTH = 8;

let searchDeadline = 0;
let searchNodeCount = 0;
let searchAborted = false;

function searchTimeUp() {
  searchNodeCount++;
  if (searchNodeCount % TIME_CHECK_INTERVAL === 0 && Date.now() > searchDeadline) searchAborted = true;
  return searchAborted;
}

// Positional weights are all small relative to material (soldier = 1), so
// they only ever break ties between similarly-safe moves — they never
// override a sound material judgment.
function evaluate(board, color) {
  let material = 0;
  let positional = 0;

  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const piece = board[row][col];
      if (!piece) continue;
      const sign = piece.color === "red" ? 1 : -1;
      material += sign * PIECE_VALUES[piece.type];

      if (piece.type === "soldier") {
        const traveled = piece.color === "red" ? 6 - row : row - 3;
        const crossed = piece.color === "red" ? row <= 4 : row >= 5;
        positional += sign * (crossed ? 0.15 + Math.max(0, traveled - 2) * 0.08 : Math.max(0, traveled) * 0.02);
      } else if (piece.type === "horse") {
        positional += sign * (4 - Math.abs(col - 4)) * 0.025; // centralized horses have more squares to jump to
      } else if (piece.type === "chariot" || piece.type === "cannon") {
        positional += sign * getPseudoMoves(board, { row, col }).length * 0.015; // open files / a platform to fire over
      }
    }
  }

  const score = material + positional;
  return color === "red" ? score : -score;
}

function generateMoves(board, color) {
  const moves = [];
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const piece = board[row][col];
      if (!piece || piece.color !== color) continue;
      const from = { row, col };
      for (const to of getLegalMoves(board, from)) {
        moves.push({ from, to, piece, captured: board[to.row][to.col] });
      }
    }
  }
  return moves;
}

function sameMove(a, b) {
  return !!a && !!b && a.from.row === b.from.row && a.from.col === b.from.col && a.to.row === b.to.row && a.to.col === b.to.col;
}

// MVV-LVA-ish ordering (most valuable victim, least valuable attacker) plus
// an optional preferred move (e.g. last iteration's best) tried first — both
// are cheap, board-data-only heuristics that make alpha-beta pruning far
// more effective without needing to simulate every move just to rank it.
function orderMoves(moves, preferredMove) {
  return moves.slice().sort((a, b) => {
    if (preferredMove) {
      const aPref = sameMove(a, preferredMove), bPref = sameMove(b, preferredMove);
      if (aPref !== bPref) return aPref ? -1 : 1;
    }
    const aScore = a.captured ? PIECE_VALUES[a.captured.type] * 10 - PIECE_VALUES[a.piece.type] : 0;
    const bScore = b.captured ? PIECE_VALUES[b.captured.type] * 10 - PIECE_VALUES[b.piece.type] : 0;
    return bScore - aScore;
  });
}

function quiescence(board, color, alpha, beta, plies) {
  if (searchTimeUp()) return { score: evaluate(board, color), pv: [] };

  const standPat = evaluate(board, color);
  if (standPat >= beta) return { score: standPat, pv: [] };
  let bestScore = Math.max(alpha, standPat);
  if (plies <= 0) return { score: bestScore, pv: [] };

  const captures = orderMoves(generateMoves(board, color).filter((m) => m.captured), null);
  let bestPV = [];
  for (const m of captures) {
    if (searchTimeUp()) break;
    const next = applyMoveToBoard(board, m.from, m.to);
    const child = quiescence(next, otherColor(color), -beta, -bestScore, plies - 1);
    const score = -child.score;
    if (score > bestScore) {
      bestScore = score;
      bestPV = [m, ...child.pv];
    }
    if (bestScore >= beta) break;
  }
  return { score: bestScore, pv: bestPV };
}

function negamax(board, color, depth, alpha, beta) {
  if (searchTimeUp()) return { score: evaluate(board, color), pv: [] };

  const moves = generateMoves(board, color);
  if (moves.length === 0) {
    // No legal moves is always a loss for `color` in Xiangqi (no stalemate
    // draw) — depth-adjust so the search prefers a forced mate that lands
    // sooner over one further away, and prefers delaying an inevitable loss.
    return { score: -(MATE_SCORE - depth), pv: [] };
  }
  if (depth <= 0) {
    return quiescence(board, color, alpha, beta, QUIESCENCE_MAX_PLIES);
  }

  const ordered = orderMoves(moves, null);
  let bestScore = -Infinity;
  let bestPV = [];
  for (const m of ordered) {
    if (searchTimeUp()) break;
    const next = applyMoveToBoard(board, m.from, m.to);
    const child = negamax(next, otherColor(color), depth - 1, -beta, -alpha);
    const score = -child.score;
    if (score > bestScore) {
      bestScore = score;
      bestPV = [m, ...child.pv];
    }
    if (bestScore > alpha) alpha = bestScore;
    if (alpha >= beta) break;
  }
  return { score: bestScore, pv: bestPV };
}

// Iterative deepening driver: searches depth 1, then 2, then 3, ... until
// the time budget runs out, always keeping the last FULLY completed depth's
// result (a depth that ran out of time partway through comparing root moves
// is discarded — its "best" move would just be whichever was tried first,
// not a fair comparison). Yields between depths so a long search doesn't
// block the UI in one uninterrupted chunk.
async function searchPosition(board, color, timeBudgetMs) {
  const rootMoves = generateMoves(board, color);
  if (rootMoves.length === 0) return { bestMove: null, pv: [], rankedMoves: [], depthReached: 0 };
  if (rootMoves.length === 1) {
    // No real decision to make, but callers (like the hint pipeline) still
    // rely on getting a genuine evaluation back — a hardcoded placeholder
    // score here would silently corrupt their "does this hang material"
    // comparisons, so still score the resulting position for real.
    const only = rootMoves[0];
    const next = applyMoveToBoard(board, only.from, only.to);
    const { score } = quiescence(next, otherColor(color), -Infinity, Infinity, QUIESCENCE_MAX_PLIES);
    return { bestMove: only, pv: [only], rankedMoves: [{ move: only, score: -score }], depthReached: 0 };
  }

  searchDeadline = Date.now() + timeBudgetMs;
  searchNodeCount = 0;
  searchAborted = false;

  let bestMove = rootMoves[0];
  let bestPV = [rootMoves[0]];
  let rankedMoves = rootMoves.map((m) => ({ move: m, score: 0 }));
  let depthReached = 0;

  for (let depth = 1; depth <= MAX_SEARCH_DEPTH; depth++) {
    let alpha = -Infinity;
    let depthBestScore = -Infinity;
    let depthBestMove = null;
    let depthBestPV = [];
    const depthRanked = [];
    let completedAllMoves = true;

    for (const m of orderMoves(rootMoves, bestMove)) {
      if (searchAborted || Date.now() > searchDeadline) { completedAllMoves = false; break; }
      const next = applyMoveToBoard(board, m.from, m.to);
      const child = negamax(next, otherColor(color), depth - 1, -Infinity, -alpha);
      const score = -child.score;
      depthRanked.push({ move: m, score });
      if (score > depthBestScore) {
        depthBestScore = score;
        depthBestMove = m;
        depthBestPV = [m, ...child.pv];
      }
      if (score > alpha) alpha = score;
    }

    if (!completedAllMoves || !depthBestMove) break;
    bestMove = depthBestMove;
    bestPV = depthBestPV;
    rankedMoves = depthRanked.sort((a, b) => b.score - a.score);
    depthReached = depth;

    if (Date.now() > searchDeadline) break;
    if (depthBestScore >= MATE_SCORE - MAX_SEARCH_DEPTH) break; // forced mate found, no need to go deeper
    await new Promise((resolve) => setTimeout(resolve, 0)); // let the UI breathe between depths
  }

  return { bestMove, pv: bestPV, rankedMoves, depthReached };
}

const DIFFICULTY_PRESETS = {
  beginner: { label: "Beginner", timeBudgetMs: 250, mistakeChance: 0.3 },
  intermediate: { label: "Intermediate", timeBudgetMs: 700, mistakeChance: 0 },
  advanced: { label: "Advanced", timeBudgetMs: 2200, mistakeChance: 0 },
};

// ---------------------------------------------------------------------------
// Hints — ranked, explained move options for the player to learn from.
// ---------------------------------------------------------------------------

const HINT_SHORTLIST_SIZE = 6;
const HINT_PER_CANDIDATE_BUDGET_MS = 150;

function positionalNote(piece, from, to) {
  if (piece.type === "soldier") {
    const crossedNow = piece.color === "red" ? to.row <= 4 : to.row >= 5;
    const crossedBefore = piece.color === "red" ? from.row <= 4 : from.row >= 5;
    if (crossedNow && !crossedBefore) return "crosses the river — it can now also step sideways, and becomes far more dangerous";
  } else if (piece.type === "horse") {
    const centralBefore = 4 - Math.abs(from.col - 4);
    const centralAfter = 4 - Math.abs(to.col - 4);
    if (centralAfter > centralBefore + 0.5) return "centralizes the Horse, giving it more squares to jump to next time";
  }
  return null;
}

function describeFollowUp(c) {
  if (!c.opponentReply) return "";
  let text = ` Likely follow-up: opponent plays ${squareLabel(c.opponentReply.from)}→${squareLabel(c.opponentReply.to)}`;
  if (c.pv.length > 1) {
    const nextOwn = c.pv[1];
    text += `, then you could continue ${squareLabel(nextOwn.from)}→${squareLabel(nextOwn.to)}`;
  }
  return text + ".";
}

function explainCandidate(c) {
  const pieceLabel = PIECE_NAMES[c.piece.type];
  const note = positionalNote(c.piece, c.from, c.to);
  const noteSuffix = note ? ` This also ${note}.` : "";
  const followUp = describeFollowUp(c);
  let tag, base;

  if (c.gameEnds === "checkmate") {
    tag = "Checkmate";
    base = "Delivers checkmate — the game ends immediately.";
  } else if (c.gameEnds === "stalemate") {
    tag = "Wins — opponent has no moves";
    base = "Leaves the opponent with no legal move at all — in Xiangqi that's an immediate win for you, not a draw.";
  } else if (c.captured && !c.hangs) {
    tag = "Wins material";
    base = `Captures the enemy ${PIECE_NAMES[c.captured.type]} — even looking a few moves ahead, there's no reply that wins it back.`;
  } else if (c.captured && c.hangs) {
    tag = "Trade — check the math";
    base = `Captures the enemy ${PIECE_NAMES[c.captured.type]}, but looking ahead the opponent has a follow-up that comes out ahead — only worth it if you're fine with that trade.`;
  } else if (c.givesCheck && !c.hangs) {
    tag = "Forcing";
    base = "Puts the enemy General in check, forcing an immediate response and handing you the initiative.";
  } else if (c.hangs) {
    tag = "Risky";
    base = `Creates pressure, but a few moves ahead the opponent has a way to come out on top from it.`;
  } else {
    tag = "Developing";
    base = `A quiet developing move for your ${pieceLabel} — no immediate tactics, but the resulting position is measurably healthier.`;
  }

  return { tag, text: base + noteSuffix + followUp };
}

async function getInsightOptions(board, color, count) {
  const enemyColor = otherColor(color);
  const legalMoves = generateMoves(board, color);
  if (legalMoves.length === 0) return [];

  // Quick, cheap heuristic shortlist first, so the expensive per-candidate
  // search below only runs on a handful of promising moves, not all of them.
  const scored = legalMoves.map((m) => {
    const next = applyMoveToBoard(board, m.from, m.to);
    const givesCheck = isInCheck(next, enemyColor);
    const quickScore = (m.captured ? PIECE_VALUES[m.captured.type] * 10 : 0) + (givesCheck ? 6 : 0) + evaluate(next, color) * 0.1;
    return { ...m, next, givesCheck, quickScore };
  });
  scored.sort((a, b) => b.quickScore - a.quickScore);
  const shortlist = scored.slice(0, HINT_SHORTLIST_SIZE);

  const results = [];
  for (const c of shortlist) {
    const immediateScore = evaluate(c.next, color);
    const search = await searchPosition(c.next, enemyColor, HINT_PER_CANDIDATE_BUDGET_MS);

    let netScore, opponentReply, pv, gameEnds;
    if (!search.bestMove) {
      // Opponent has no legal reply at all — an unconditional win for us
      // either way, since Xiangqi has no stalemate draw.
      netScore = MATE_SCORE - 1;
      opponentReply = null;
      pv = [];
      gameEnds = c.givesCheck ? "checkmate" : "stalemate";
    } else {
      netScore = -search.rankedMoves[0].score;
      opponentReply = search.bestMove;
      pv = search.pv;
      gameEnds = null;
    }

    const hangs = netScore < immediateScore - 0.5;
    results.push({
      from: c.from, to: c.to, piece: c.piece, captured: c.captured, givesCheck: c.givesCheck,
      gameEnds, netScore, hangs, opponentReply, pv,
    });
  }

  results.sort((a, b) => b.netScore - a.netScore);
  return results.slice(0, count).map((c) => ({ ...c, explanation: explainCandidate(c) }));
}

const CELL = 56;
const MARGIN = 32;
const BOARD_WIDTH = MARGIN * 2 + (COLS - 1) * CELL;
const BOARD_HEIGHT = MARGIN * 2 + (ROWS - 1) * CELL;

function x(col) { return MARGIN + col * CELL; }
function y(row) { return MARGIN + row * CELL; }

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

const state = {
  mode: "two-player", // "two-player" | "vs-computer" | "online"
  humanColor: "red",
  computerDifficulty: "intermediate", // "beginner" | "intermediate" | "advanced"
  board: createInitialBoard(),
  turn: "red",
  selected: null,
  history: [],
  positionKeys: [positionKey(createInitialBoard(), "red")],
  moveRecords: [],
  lastMove: null,
  status: { over: false },
  hintOptions: null,
  hintHighlightIndex: 0,
  hintThinking: false,
  showHelp: false,
  thinking: false,
  linkCopied: false,
  online: { roomId: null, color: null, status: "idle", error: null },
};

let peer = null;
let conn = null;
let applyingRemoteMove = false;

function computerColor() {
  return state.mode === "vs-computer" ? otherColor(state.humanColor) : null;
}

// ---------------------------------------------------------------------------
// Game actions
// ---------------------------------------------------------------------------

function resetGame() {
  state.board = createInitialBoard();
  state.turn = "red";
  state.selected = null;
  state.history = [];
  state.positionKeys = [positionKey(state.board, state.turn)];
  state.moveRecords = [];
  state.lastMove = null;
  state.status = { over: false };
  state.hintOptions = null;
  state.hintHighlightIndex = 0;
  state.hintThinking = false;
  state.thinking = false;
  render();
}

function applyMove(from, to) {
  const movingPiece = state.board[from.row][from.col];
  if (!movingPiece) return;
  const isChaseMove = moveIsChase(state.board, from, to);
  const next = cloneBoard(state.board);
  next[to.row][to.col] = movingPiece;
  next[from.row][from.col] = null;

  state.history.push({ board: state.board, turn: state.turn });
  const moverColor = state.turn;
  state.board = next;
  state.lastMove = { from, to };
  state.selected = null;
  state.hintOptions = null;
  state.hintHighlightIndex = 0;

  const nextTurn = otherColor(moverColor);
  state.turn = nextTurn;
  const isCheckMove = isInCheck(next, nextTurn);

  state.positionKeys.push(positionKey(next, nextTurn));
  state.moveRecords.push({ color: moverColor, isCheck: isCheckMove, isChase: isChaseMove });

  if (!hasAnyLegalMove(next, nextTurn)) {
    const reason = isCheckMove ? "checkmate" : "stalemate";
    state.status = { over: true, winner: moverColor, reason };
  } else {
    const verdict = evaluateRepetition();
    if (verdict && verdict.type === "loss") {
      state.status = { over: true, winner: otherColor(verdict.loser), reason: verdict.reason };
    } else if (verdict && verdict.type === "draw") {
      state.status = { over: true, winner: null, reason: verdict.reason };
    } else {
      state.status = { over: false };
    }
  }

  if (state.mode === "online" && !applyingRemoteMove) {
    sendOnline({ type: "move", from, to });
  }

  render();
}

function undoMove() {
  if (state.history.length === 0 || state.status.over || state.thinking) return;
  const stepsBack = state.mode === "vs-computer" && state.history.length >= 2 ? 2 : 1;
  const prev = state.history[state.history.length - stepsBack];
  state.board = prev.board;
  state.turn = prev.turn;
  state.history = state.history.slice(0, -stepsBack);
  state.positionKeys = state.positionKeys.slice(0, -stepsBack);
  state.moveRecords = state.moveRecords.slice(0, -stepsBack);
  state.selected = null;
  state.lastMove = null;
  state.status = { over: false };
  state.hintOptions = null;
  state.hintHighlightIndex = 0;
  render();
}

function handleSquareClick(row, col) {
  if (state.status.over || state.thinking || state.hintThinking) return;
  const cc = computerColor();
  if (cc && state.turn === cc) return;
  if (state.mode === "online" && (state.online.status !== "connected" || state.turn !== state.online.color)) return;

  const piece = state.board[row][col];
  const pos = { row, col };

  if (state.selected) {
    const legal = getLegalMoves(state.board, state.selected);
    if (legal.some((m) => m.row === row && m.col === col)) {
      applyMove(state.selected, pos);
      return;
    }
    if (piece && piece.color === state.turn) {
      state.selected = pos;
      render();
      return;
    }
    state.selected = null;
    render();
    return;
  }

  if (piece && piece.color === state.turn) {
    state.selected = pos;
    render();
  }
}

async function requestHint() {
  if (state.status.over || state.thinking || state.hintThinking) return;
  const cc = computerColor();
  if (cc && state.turn === cc) return;
  state.hintThinking = true;
  render();
  const options = await getInsightOptions(state.board, state.turn, 3);
  state.hintThinking = false;
  state.hintOptions = options;
  state.hintHighlightIndex = 0;
  render();
}

function selectHintOption(index) {
  if (!state.hintOptions || !state.hintOptions[index]) return;
  state.hintHighlightIndex = index;
  render();
}

async function maybeTriggerComputerMove() {
  const cc = computerColor();
  if (!cc || state.turn !== cc || state.status.over || state.thinking) return;
  state.thinking = true;
  render();
  await new Promise((resolve) => setTimeout(resolve, 200)); // brief pause so a move never feels instant/jarring

  const preset = DIFFICULTY_PRESETS[state.computerDifficulty] || DIFFICULTY_PRESETS.intermediate;
  const legalMoves = generateMoves(state.board, cc);
  let chosen = null;
  if (legalMoves.length > 0 && Math.random() < preset.mistakeChance) {
    chosen = legalMoves[Math.floor(Math.random() * legalMoves.length)];
  } else {
    const result = await searchPosition(state.board, cc, preset.timeBudgetMs);
    chosen = result.bestMove;
  }

  state.thinking = false;
  if (chosen) applyMove(chosen.from, chosen.to);
  else render();
}

function changeMode(nextMode) {
  if (nextMode === state.mode) return;
  if (state.mode === "online") teardownOnline();
  state.mode = nextMode;
  resetGame();
}

function changeHumanColor(color) {
  state.humanColor = color;
  resetGame();
}

function changeDifficulty(level) {
  if (!DIFFICULTY_PRESETS[level] || state.computerDifficulty === level) return;
  state.computerDifficulty = level;
  render();
}

function toggleHelp() {
  state.showHelp = !state.showHelp;
  render();
}

// ---------------------------------------------------------------------------
// Online (WebRTC via PeerJS public broker — no custom backend required)
// ---------------------------------------------------------------------------

function randomRoomId() {
  return (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`).replace(/-/g, "");
}

function setOnlineError(err) {
  state.online.status = "error";
  const type = err && err.type;
  state.online.error =
    type === "unavailable-id" ? "This game link already has two players." :
    type === "peer-unavailable" ? "Couldn't find that game. It may have ended." :
    "Something went wrong connecting to the game.";
  render();
}

let joinAttempts = 0;

function wireConnection(c, roomIdForRetry) {
  c.on("open", () => {
    state.online.status = "connected";
    joinAttempts = 0;
    render();
  });
  c.on("data", (message) => handleRemoteMessage(message));
  c.on("close", () => {
    // Joiner side: a dropped connection is often just a transient network
    // blip (mobile in-app browsers in particular suspend background tabs
    // aggressively), so retry a few times before giving up. Host side just
    // waits — its peer.on("connection") listener stays live for a fresh
    // incoming connection if the joiner reconnects.
    const isJoiner = state.online.color === "black";
    if (isJoiner && roomIdForRetry && joinAttempts < 3 && peer && !peer.destroyed) {
      joinAttempts += 1;
      state.online.status = "connecting";
      render();
      setTimeout(() => setupJoinConnection(roomIdForRetry), 1500);
      return;
    }
    state.online.status = "opponent-left";
    render();
  });
  c.on("error", () => setOnlineError());
}

function handleRemoteMessage(message) {
  if (!message || typeof message !== "object") return;
  if (message.type === "move") {
    applyingRemoteMove = true;
    applyMove(message.from, message.to);
    applyingRemoteMove = false;
  } else if (message.type === "reset") {
    resetGame();
  }
}

function sendOnline(message) {
  if (conn && conn.open) conn.send(message);
}

function setupHostPeer(roomId, isRetry) {
  peer = new Peer(roomId);
  peer.on("open", () => {
    state.online.status = "waiting";
    render();
  });
  peer.on("connection", (c) => {
    conn = c;
    state.online.color = "red";
    wireConnection(c);
  });
  peer.on("disconnected", () => {
    // The signaling connection to the broker dropped (common when a mobile
    // browser suspends a backgrounded tab) but our Peer object is still
    // alive — try to resume it under the same room id.
    if (peer && !peer.destroyed) peer.reconnect();
  });
  peer.on("error", (err) => {
    // A fresh reload can race the broker cleaning up our previous
    // registration under this id; one short retry covers that window.
    if (err && err.type === "unavailable-id" && !isRetry) {
      setTimeout(() => setupHostPeer(roomId, true), 1500);
      return;
    }
    setOnlineError(err);
  });
}

function createOnlineGame() {
  const roomId = randomRoomId();
  const url = new URL(location.href);
  url.searchParams.set("room", roomId);
  history.replaceState(null, "", url);
  try { sessionStorage.setItem("xiangqiHostRoomId", roomId); } catch (e) {}

  state.online = { roomId, color: null, status: "connecting", error: null };
  resetGame();
  setupHostPeer(roomId);
}

// A page reload with ?room=<id> in the URL always looks the same whether
// you created the game or joined it — this restores the host role instead
// of misreading your own reload as a fresh join attempt against your own
// (now-dead) connection.
function resumeAsHost(roomId) {
  state.mode = "online";
  state.online = { roomId, color: null, status: "connecting", error: null };
  resetGame();
  setupHostPeer(roomId);
}

function setupJoinConnection(roomId) {
  conn = peer.connect(roomId, { reliable: true });
  wireConnection(conn, roomId);
}

function joinOnlineRoom(roomId) {
  state.mode = "online";
  state.online = { roomId, color: "black", status: "connecting", error: null };
  resetGame();
  joinAttempts = 0;

  peer = new Peer();
  peer.on("open", () => setupJoinConnection(roomId));
  peer.on("disconnected", () => {
    if (peer && !peer.destroyed) peer.reconnect();
  });
  peer.on("error", (err) => setOnlineError(err));
}

function teardownOnline() {
  if (conn) { try { conn.close(); } catch (e) {} conn = null; }
  if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
  applyingRemoteMove = false;
  try { sessionStorage.removeItem("xiangqiHostRoomId"); } catch (e) {}
  state.online = { roomId: null, color: null, status: "idle", error: null };
}

function rematch() {
  resetGame();
  sendOnline({ type: "reset" });
}

async function copyRoomLink() {
  try {
    await navigator.clipboard.writeText(location.href);
    state.linkCopied = true;
    render();
    setTimeout(() => { state.linkCopied = false; render(); }, 2000);
  } catch (e) {
    // Clipboard API may be unavailable; the link is still visible/selectable in the input field.
  }
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

function renderModeTabs() {
  const modeBtn = (mode, label) =>
    `<button class="${state.mode === mode ? "active" : ""}" onclick="changeMode('${mode}')">${label}</button>`;
  let html = `<div class="tabgroup">${modeBtn("two-player", "Two Players")}${modeBtn("vs-computer", "Vs Computer")}${modeBtn("online", "Play Online")}</div>`;

  if (state.mode === "vs-computer") {
    html += `<div class="tabgroup">
      <button class="${state.humanColor === "red" ? "active red" : ""}" onclick="changeHumanColor('red')">Play Red</button>
      <button class="${state.humanColor === "black" ? "active" : ""}" onclick="changeHumanColor('black')">Play Black</button>
    </div>`;
    const diffBtn = (level) =>
      `<button class="${state.computerDifficulty === level ? "active" : ""}" onclick="changeDifficulty('${level}')">${DIFFICULTY_PRESETS[level].label}</button>`;
    html += `<div class="tabgroup">${diffBtn("beginner")}${diffBtn("intermediate")}${diffBtn("advanced")}</div>`;
  }

  html += `<button class="pill-btn" onclick="toggleHelp()">${state.showHelp ? "Hide Rules" : "How to Play"}</button>`;
  return html;
}

function renderOnlinePanel() {
  if (state.mode !== "online") return "";

  if (!state.online.roomId) {
    return `<div class="panel center">
      <p>Create a game and send the link to a friend to play remotely. No accounts, no install — just the link.</p>
      <button class="pill-btn primary" onclick="createOnlineGame()">Create Game</button>
    </div>`;
  }

  const statusLine = (() => {
    switch (state.online.status) {
      case "connecting": return `<p>Connecting…</p>`;
      case "waiting": return `<p>Waiting for your opponent to open the link…</p>`;
      case "connected": return `<p>Connected — you are playing <strong>${state.online.color}</strong>.</p>`;
      case "opponent-left": return `<p class="amber">Your opponent disconnected.</p>`;
      case "error": return `<p style="color:#f87171">${escapeAttr(state.online.error)}</p>`;
      default: return "";
    }
  })();

  return `<div class="panel center">
    <div class="link-row">
      <input readonly value="${escapeAttr(location.href)}" onfocus="this.select()" />
      <button class="pill-btn" onclick="copyRoomLink()">${state.linkCopied ? "Copied!" : "Copy Link"}</button>
    </div>
    ${statusLine}
  </div>`;
}

function renderHelpPanel() {
  if (!state.showHelp) return "";
  const pieceItems = PIECE_TIPS.map((p) => `<li><strong>${p.label}:</strong> ${p.tip}</li>`).join("");
  const strategyItems = STRATEGY_TIPS.map((t) => `<li>${t}</li>`).join("");
  const ruleItems = GAME_END_RULES.map((r) => `<li><strong>${r.label}:</strong> ${r.tip}</li>`).join("");
  return `<div class="panel" style="text-align:left; max-width:640px;">
    <h3>Objective</h3>
    <p>Checkmate the enemy General, or leave your opponent with no legal move at all — both end the game immediately. Red always moves first.</p>
    <h3>How each piece moves</h3>
    <ul>${pieceItems}</ul>
    <h3>How the game can end</h3>
    <ul>${ruleItems}</ul>
    <h3>Tips for learning</h3>
    <ul style="list-style:disc;">${strategyItems}</ul>
  </div>`;
}

function renderStatusPills() {
  const inCheck = !state.status.over && isInCheck(state.board, state.turn);
  let html = `<div class="row">`;

  const turnClass = state.turn === "red" ? "turn-red" : "turn-black";
  const turnText = state.status.over
    ? "Game Over"
    : state.thinking
      ? "Computer is thinking…"
      : `${state.turn === "red" ? "Red" : "Black"} to move`;
  html += `<div class="status-pill ${turnClass}">${turnText}</div>`;

  if (!state.status.over && !state.thinking && inCheck) {
    html += `<div class="status-pill check">Check!</div>`;
  }
  if (state.status.over) {
    const outcomeText = state.status.winner
      ? `${state.status.winner === "red" ? "Red" : "Black"} wins by ${state.status.reason}`
      : `Draw by ${state.status.reason}`;
    html += `<div class="status-pill over">${outcomeText}</div>`;
  }
  html += `</div>`;
  return html;
}

function renderBoard() {
  const { board, selected, lastMove, hintOptions, hintHighlightIndex } = state;
  const legalMoves = selected ? getLegalMoves(board, selected) : [];
  const activeHint = hintOptions ? hintOptions[hintHighlightIndex] : null;

  let lines = "";
  for (let row = 0; row < ROWS; row++) {
    lines += `<line x1="${x(0)}" y1="${y(row)}" x2="${x(COLS - 1)}" y2="${y(row)}" stroke="#5c4326" stroke-width="1.5" />`;
  }
  for (let col = 0; col < COLS; col++) {
    const isEdge = col === 0 || col === COLS - 1;
    if (isEdge) {
      lines += `<line x1="${x(col)}" y1="${y(0)}" x2="${x(col)}" y2="${y(ROWS - 1)}" stroke="#5c4326" stroke-width="1.5" />`;
    } else {
      lines += `<line x1="${x(col)}" y1="${y(0)}" x2="${x(col)}" y2="${y(4)}" stroke="#5c4326" stroke-width="1.5" />`;
      lines += `<line x1="${x(col)}" y1="${y(5)}" x2="${x(col)}" y2="${y(ROWS - 1)}" stroke="#5c4326" stroke-width="1.5" />`;
    }
  }

  const palace = `
    <line x1="${x(3)}" y1="${y(0)}" x2="${x(5)}" y2="${y(2)}" stroke="#5c4326" stroke-width="1.5" />
    <line x1="${x(5)}" y1="${y(0)}" x2="${x(3)}" y2="${y(2)}" stroke="#5c4326" stroke-width="1.5" />
    <line x1="${x(3)}" y1="${y(7)}" x2="${x(5)}" y2="${y(9)}" stroke="#5c4326" stroke-width="1.5" />
    <line x1="${x(5)}" y1="${y(7)}" x2="${x(3)}" y2="${y(9)}" stroke="#5c4326" stroke-width="1.5" />
  `;

  const river = `
    <text x="${x(1.5)}" y="${y(4.5) + 8}" font-size="20" fill="#5c4326" font-family="serif" text-anchor="middle">楚 河</text>
    <text x="${x(6.5)}" y="${y(4.5) + 8}" font-size="20" fill="#5c4326" font-family="serif" text-anchor="middle">漢 界</text>
  `;

  const lastMoveHtml = lastMove ? `
    <circle cx="${x(lastMove.from.col)}" cy="${y(lastMove.from.row)}" r="${CELL / 2 - 6}" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3" opacity="0.6" />
    <circle cx="${x(lastMove.to.col)}" cy="${y(lastMove.to.row)}" r="${CELL / 2 - 6}" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.6" />
  ` : "";

  const hintHtml = activeHint ? `
    <circle cx="${x(activeHint.from.col)}" cy="${y(activeHint.from.row)}" r="${CELL / 2 - 3}" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5 4" />
    <circle cx="${x(activeHint.to.col)}" cy="${y(activeHint.to.row)}" r="${CELL / 2 - 3}" fill="none" stroke="#f59e0b" stroke-width="3" />
  ` : "";

  const legalHtml = legalMoves.map((m) => {
    const occupied = board[m.row][m.col];
    return occupied
      ? `<circle cx="${x(m.col)}" cy="${y(m.row)}" r="${CELL / 2 - 4}" fill="none" stroke="rgba(16,185,129,0.85)" stroke-width="3" class="sq-ignore" />`
      : `<circle cx="${x(m.col)}" cy="${y(m.row)}" r="7" fill="rgba(16,185,129,0.55)" class="sq-ignore" />`;
  }).join("");

  let squaresHtml = "";
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const piece = board[row][col];
      const isSelected = selected && selected.row === row && selected.col === col;
      squaresHtml += `<g class="sq" data-square data-row="${row}" data-col="${col}">
        <rect x="${x(col) - CELL / 2}" y="${y(row) - CELL / 2}" width="${CELL}" height="${CELL}" fill="transparent" />
        ${isSelected ? `<circle cx="${x(col)}" cy="${y(row)}" r="${CELL / 2 - 4}" fill="none" stroke="#0ea5e9" stroke-width="3" />` : ""}
        ${piece ? `
          <circle cx="${x(col)}" cy="${y(row)}" r="${CELL / 2 - 8}" fill="#f3e6c8" stroke="${piece.color === "red" ? "#b91c1c" : "#18181b"}" stroke-width="2.5" />
          <text x="${x(col)}" y="${y(row) + 8}" font-size="22" font-family="serif" font-weight="700" text-anchor="middle" fill="${piece.color === "red" ? "#b91c1c" : "#18181b"}">${PIECE_LABELS[piece.color][piece.type]}</text>
        ` : ""}
      </g>`;
    }
  }

  return `<div class="board-frame">
    <svg width="${BOARD_WIDTH}" height="${BOARD_HEIGHT}" viewBox="0 0 ${BOARD_WIDTH} ${BOARD_HEIGHT}" role="img" aria-label="Xiangqi board">
      ${lines}${palace}${river}${lastMoveHtml}${hintHtml}${legalHtml}${squaresHtml}
    </svg>
  </div>`;
}

function renderControls() {
  const hasActiveOnlineRoom = state.mode !== "online" || state.online.roomId;
  if (!hasActiveOnlineRoom) return "";

  const cc = computerColor();
  const hintDisabled = state.status.over || state.thinking || state.hintThinking || (cc !== null && state.turn === cc);
  const undoDisabled = state.history.length === 0 || state.thinking || state.hintThinking || state.status.over;

  let html = `<div class="row">
    <button class="pill-btn amber" ${hintDisabled ? "disabled" : ""} onclick="requestHint()">${state.hintThinking ? "Thinking…" : "Hint"}</button>`;

  if (state.mode !== "online") {
    html += `<button class="pill-btn" ${undoDisabled ? "disabled" : ""} onclick="undoMove()">Undo</button>`;
  }

  html += state.mode === "online"
    ? `<button class="pill-btn" onclick="rematch()">Rematch</button>`
    : `<button class="pill-btn" onclick="resetGame()">New Game</button>`;

  html += `</div>`;
  return html;
}

const FILES = "abcdefghi";
function squareLabel(pos) {
  return `${FILES[pos.col]}${pos.row}`;
}

function renderHintPanel() {
  if (!state.hintOptions || state.hintOptions.length === 0 || state.status.over) return "";

  const rows = state.hintOptions.map((opt, i) => {
    const active = i === state.hintHighlightIndex;
    const pieceLabel = PIECE_NAMES[opt.piece.type];
    const moveLabel = opt.captured
      ? `${pieceLabel} ${squareLabel(opt.from)} × ${PIECE_NAMES[opt.captured.type]} ${squareLabel(opt.to)}`
      : `${pieceLabel} ${squareLabel(opt.from)} → ${squareLabel(opt.to)}`;
    return `<button class="hint-option ${active ? "active" : ""}" onclick="selectHintOption(${i})">
      <div class="hint-option-head">
        <span class="hint-rank">#${i + 1}</span>
        <span class="hint-move">${escapeAttr(moveLabel)}</span>
        <span class="hint-tag">${escapeAttr(opt.explanation.tag)}</span>
      </div>
      <div class="hint-option-text">${escapeAttr(opt.explanation.text)}</div>
    </button>`;
  }).join("");

  return `<div class="panel" style="max-width:640px; text-align:left;">
    <h3 style="margin-bottom:8px;">Move Options</h3>
    ${rows}
  </div>`;
}

function renderFooterCaption() {
  if (state.hintOptions) return "";
  const selectedPiece = state.selected ? state.board[state.selected.row][state.selected.col] : null;
  if (selectedPiece && !state.status.over) {
    return `<p class="selected-caption">Selected: ${selectedPiece.color} ${selectedPiece.type} — tap a highlighted square to move.</p>`;
  }
  return "";
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="row">${renderModeTabs()}</div>
    ${renderOnlinePanel()}
    ${renderHelpPanel()}
    ${renderStatusPills()}
    ${renderBoard()}
    ${renderControls()}
    ${renderHintPanel()}
    ${renderFooterCaption()}
  `;
  maybeTriggerComputerMove();
}

// Delegate square clicks once; render() only replaces innerHTML, it never
// re-attaches this listener.
document.getElementById("app").addEventListener("click", (event) => {
  const square = event.target.closest("[data-square]");
  if (!square) return;
  handleSquareClick(Number(square.dataset.row), Number(square.dataset.col));
});

// Auto-join a room shared via link, e.g. ?room=<id>. A reload of the host's
// own tab carries the same ?room= param, so sessionStorage is what tells
// the two cases apart.
const roomFromUrl = new URLSearchParams(location.search).get("room");
if (roomFromUrl) {
  let wasHost = false;
  try { wasHost = sessionStorage.getItem("xiangqiHostRoomId") === roomFromUrl; } catch (e) {}
  if (wasHost) {
    resumeAsHost(roomFromUrl);
  } else {
    joinOnlineRoom(roomFromUrl);
  }
} else {
  render();
}
</script>
</body>
</html>
